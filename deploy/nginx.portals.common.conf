# 被三个 server 块共用；root、API 上游和健康探针由各端配置。
server_tokens off;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
client_max_body_size 2m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 2s;
proxy_read_timeout 60s;
proxy_next_upstream error timeout;

# 其他端的 API 和不完整的 API 前缀不得回退到前端 index.html。
location = /api { return 404; }
location /api/ { return 404; }
location / { try_files $uri $uri/ /index.html; }
location /assets/ { expires 30d; }
location = /index.html { expires -1; }
location = /version.json { expires -1; }
