# GoAllAdmin 前端托管 + /api 反代示例（规范 §5.2：前后端同源，刷新 Cookie 才能带上）。
#
# 用法：把 web/apps/platform/dist 放到 /usr/share/nginx/html/platform，后端在 server:8080，
# 或者直接 docker compose -f deploy/docker-compose.yml up -d（deploy/Dockerfile.web 已按这个文件构建）。
#
# 生产环境请在 TLS 终结处加 HSTS（写法见下面的注释），并按需要收紧 CSP。
# 后台不要和不受信任的站点共用同一个主域：同一主域下的其他站点能往浏览器里写 Cookie、能发 SameSite 视为同站的请求。
#
# 客户端 IP：这台 nginx 是入口，所以它把 X-Forwarded-For 直接设成 $remote_addr（覆盖，不追加），
# 客户端自己带的转发头一律丢弃；后端 trustedProxies 只填这台 nginx 的地址（规范 §12.2）。
# 如果 nginx 前面还有 CDN 或负载均衡，改成 $proxy_add_x_forwarded_for 并用 set_real_ip_from 只信任那一层。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off; # 响应头和错误页不带 nginx 版本号

    root /usr/share/nginx/html;
    index index.html;

    # 安全头（与后端一致；后端接口自己也会带）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 示例 CSP：前端产物不内联脚本；图形验证码是 data: 图片。
    # base-uri、form-action 不回落到 default-src，要单独写：否则注入的 <base> 能改写相对地址，注入的表单能把密码提交到外站
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 走 HTTPS 时在 TLS 终结处加（这里是明文 80 端口的示例，不能加）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 后端接口：原样转发，保留 Origin / Cookie，给出真实来源 IP
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # 健康与就绪探针都交给后端：/readyz 要是落进下面的单页应用回退，会用 index.html 的 200 假报就绪
    location = /healthz {
        proxy_pass http://server:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://server:8080/readyz;
    }

    # 平台端：/ 下的单页应用。多个端时按路径各放一份产物，如 /agent/ → html/agent。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源可以长缓存；index.html 不缓存。
    # 这里故意只用 expires 不用 add_header：location 里一旦出现 add_header，上面 server 级的安全头就不再继承。
    location /assets/ {
        expires 30d;
    }

    location = /index.html {
        expires -1;
    }

    # 构建编号：前端定期读它，发现换了版本就提示刷新，所以不能缓存。
    location = /version.json {
        expires -1;
    }
}
