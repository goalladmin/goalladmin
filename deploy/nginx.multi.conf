# 同一平台端的多实例示例。与单实例 nginx.conf 分开使用。
# Docker DNS 动态解析容器重建后的地址；本配置使用 nginx 1.30 镜像。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream platform_backend {
    zone platform_backend 64k;
    ip_hash;
    server server-a:8080 resolve max_fails=1 fail_timeout=5s;
    server server-b:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 生产在 TLS 终结处配置 HSTS；后端 allowedOrigins 填浏览器实际访问的 https 来源。
    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    # 不添加 non_idempotent：已经发出的登录、刷新等请求不得切换实例重试。
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    location /api/ {
        proxy_pass http://platform_backend;
    }
    location = /healthz {
        proxy_pass http://platform_backend;
    }
    location = /readyz {
        proxy_pass http://platform_backend;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
    }
    location = /index.html {
        expires -1;
    }
    location = /version.json {
        expires -1;
    }
}
